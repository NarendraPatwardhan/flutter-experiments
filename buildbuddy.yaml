# BuildBuddy Workflows CI (optional). Requires the BuildBuddy GitHub app on the
# repo. Local `bb build --config=buildbuddy` does not need this file.
#
# The workflow runner is the Bazel coordinator; Flutter actions execute under
# the RBE image pinned in `.bazelrc` (--config=buildbuddy).
actions:
  - name: "Flutter web"
    container_image: "ubuntu-20.04"
    triggers:
      push:
        branches:
          - "master"
          - "main"
      pull_request:
        branches:
          - "*"
    steps:
      - run: "bazel build --config=buildbuddy //:app.web"
      - run: "bazel test --config=buildbuddy //:widget_test"
