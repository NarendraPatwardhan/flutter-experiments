# BuildBuddy Workflows — runs after push when the GitHub app is connected.
# This is the preferred "fully remote coordinator" path for CI.
actions:
  - name: "Flutter web (remote)"
    container_image: "ubuntu-20.04"
    triggers:
      push:
        branches:
          - "master"
          - "main"
      pull_request:
        branches:
          - "*"
    steps:
      - run: "bb build //:app.web"
      - run: "bb test //:widget_test"
